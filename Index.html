
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waqas Cricket Score</title>
<style>
body{font-family:Arial;background:#eef3f0;margin:0;padding:15px}
.container{max-width:500px;margin:auto;background:white;padding:20px;border-radius:16px;box-shadow:0 4px 15px #ccc}
h1{text-align:center;color:#087443}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;box-sizing:border-box;font-size:16px}
input,select{border:1px solid #ccc}
button{background:#087443;color:white;border:none;font-weight:bold}
.score{background:#087443;color:white;padding:20px;text-align:center;border-radius:12px;margin:15px 0}
.score h2{font-size:38px;margin:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{font-size:22px;padding:18px 5px}
.secondary{background:#333}
</style>
</head>
<body>
<div class="container">
<h1>🏏 Waqas Cricket Score</h1>

<div id="setup">
<h3>Match Setup</h3>
<input id="team1" placeholder="Team 1 Name">
<input id="team2" placeholder="Team 2 Name">
<input id="overs" type="number" value="20" placeholder="Overs">

<h3>Toss</h3>
<select id="toss">
<option value="">Select Toss Winner</option>
</select>
<select id="decision">
<option value="bat">Bat First</option>
<option value="bowl">Bowl First</option>
</select>
<button onclick="startMatch()">Start Match</button>
</div>

<div id="match" style="display:none">
<div class="score">
<div id="batting"></div>
<h2 id="score">0/0</h2>
<div id="over">Overs: 0.0</div>
</div>
<div class="grid">
<button onclick="add(0)">0</button>
<button onclick="add(1)">1</button>
<button onclick="add(2)">2</button>
<button onclick="add(3)">3</button>
<button onclick="add(4)">4</button>
<button onclick="add(6)">6</button>
<button onclick="wicket()">Wicket</button>
<button onclick="extra()">Wide</button>
<button onclick="undo()" class="secondary">Undo</button>
</div>
<button class="secondary" onclick="resetMatch()">Reset Match</button>
</div>
</div>

<script>
let runs=0,wickets=0,balls=0,history=[];
let teamA="",teamB="",battingTeam="";
let maxOvers=20;

function startMatch(){
teamA=document.getElementById("team1").value.trim();
teamB=document.getElementById("team2").value.trim();
maxOvers=parseInt(document.getElementById("overs").value)||20;
let toss=document.getElementById("toss").value;
let decision=document.getElementById("decision").value;

if(!teamA||!teamB){alert("Enter both team names");return}
if(!toss){alert("Select toss winner");return}

battingTeam=(decision==="bat")?toss:(toss===teamA?teamB:teamA);
document.getElementById("setup").style.display="none";
document.getElementById("match").style.display="block";
document.getElementById("batting").innerText=battingTeam+" batting";
update();
}

function save(){
history.push({runs,wickets,balls});
}

function add(n){
if(balls>=maxOvers*6||wickets>=10)return;
save();runs+=n;balls++;update();
}

function wicket(){
if(balls>=maxOvers*6||wickets>=10)return;
save();wickets++;balls++;update();
}

function extra(){
if(balls>=maxOvers*6)return;
save();runs++;update();
}

function undo(){
if(history.length===0)return;
let s=history.pop();
runs=s.runs;wickets=s.wickets;balls=s.balls;
update();
}

function update(){
document.getElementById("score").innerText=runs+"/"+wickets;
document.getElementById("over").innerText="Overs: "+Math.floor(balls/6)+"."+(balls%6);
if(balls>=maxOvers*6||wickets>=10){
document.getElementById("over").innerText+=" - Innings Finished";
}
}

function resetMatch(){
if(confirm("Reset match?")){
runs=0;wickets=0;balls=0;history=[];
update();
}
}
</script>
</body>
</html>
